[package]
name = "gyroid"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TPMS lattice (gyroid and friends) generator: fills a body STL, writes a watertight STL for SolidCraft's Insert Mesh"
publish = false

[features]
default = ["cli", "parallel"]
# The gyroid.exe command line.
cli = ["dep:clap"]
# Multithreaded (not available inside a SolidCraft plugin, which is single-threaded WebAssembly).
parallel = ["dep:rayon"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
rayon = { version = "1", optional = true }

[[bin]]
name = "gyroid"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
